name: edge
on:
  push:
    paths: ["edge/**", "models/**", ".github/workflows/edge.yml"]
  pull_request:
    paths: ["edge/**", "models/**", ".github/workflows/edge.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-declarative-dev qt6-multimedia-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs qml6-module-qtmultimedia qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qtquick-templates qml6-module-qtcore \
            libgl-dev fonts-inter
      - uses: actions/cache@v4
        with:
          path: edge/build/_deps
          key: litert-deps-${{ hashFiles('edge/cmake/LiteRT.cmake') }}
      - name: Configure (fetches LiteRT v2.21 source)
        run: cmake -S edge -B edge/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build edge/build --parallel
      - name: Test (unit + Python parity)
        run: ctest --test-dir edge/build --output-on-failure
      - name: Benchmark
        run: |
          edge/build/cli/cropdx-cli --model models/crop_disease_int8.tflite --labels models/labels.txt \
            --threads 2 --bench 100 edge/tests/data/leaf.jpg | tee bench.txt
      - name: Headless UI screenshot
        env: { QT_QPA_PLATFORM: offscreen }
        run: edge/build/app/cropdx-app --image edge/tests/data/leaf.jpg --screenshot edge-ui.png
      - uses: actions/upload-artifact@v4
        with:
          name: edge-linux
          path: |
            edge/build/app/cropdx-app
            edge/build/cli/cropdx-cli
            bench.txt
            edge-ui.png
