name: mobile
on:
  push:
    paths: ["mobile/**", "models/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "models/**", ".github/workflows/mobile.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platform folders and sync model
        run: tool/bootstrap.sh
      - run: flutter analyze --no-fatal-infos
      - name: flutter test (failures shown as PR annotations)
        run: |
          status=0
          flutter test --reporter json > test-results.jsonl || status=$?
          jq -r 'select(.type=="testStart") | "\(.test.id)\t\(.test.name)"' test-results.jsonl > names.tsv
          jq -r 'select(.type=="error") | "\(.testID)\t\((.error + " " + .stackTrace) | gsub("[\r\n]+"; " ") | .[0:900])"' test-results.jsonl |
            while IFS=$'\t' read -r id msg; do
              name=$(awk -F'\t' -v i="$id" '$1==i {print $2}' names.tsv)
              echo "::error title=${name:-flutter test}::${msg}"
            done
          exit $status
      - name: flutter build apk (errors shown as PR annotations)
        run: |
          set -o pipefail
          status=0
          flutter build apk --release 2>&1 | tee build.log || status=$?
          if [ $status -ne 0 ]; then
            msg=$(grep -E -A6 "What went wrong|error:|Error:|e: |FAILURE" build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=flutter build apk::${msg}"
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: croheal-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
