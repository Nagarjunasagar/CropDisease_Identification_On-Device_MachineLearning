name: croheal
description: On-device tomato leaf disease identification (LiteRT + Flutter).
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  image: ^4.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
